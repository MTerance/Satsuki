name: akiba-quiz-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: akibaquiz-web:0.1
    container_name: akiba-quiz-dev-web

    ports:
      - "127.0.0.1:8091:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

    volumes:
      - orchard-data:/app/App_Data

    restart: unless-stopped

volumes:
  orchard-data: